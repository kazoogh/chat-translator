name: portable-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run gct-validate .
      - run: uv run pytest -m "not language and not windows_ui and not vision and not translation_native"

  windows-packaging-smoke:
    needs: [portable, windows-ui, windows-vision, windows-translation]
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra build
      - shell: pwsh
        run: .\scripts\packaging_smoke.ps1

  windows-ui:
    needs: portable
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra capture --extra ui
      - run: uv run mypy
      - run: uv run pytest -m windows_ui

  windows-vision:
    needs: portable
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra language --extra vision
      - name: Verify pinned OCR wheels import on Windows
        run: uv run python -c "import cv2, fasttext, numpy, paddle, paddleocr; print(cv2.__version__, numpy.__version__, paddle.__version__, paddleocr.__version__)"
      - run: uv run pytest -m "language or vision"

  windows-translation:
    needs: portable
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra translation
      - name: Verify pinned local translation runtimes import on Windows
        run: uv run pytest -m translation_native
