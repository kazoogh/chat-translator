[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "game-chat-translator"
version = "0.1.0"
description = "Offline-first Windows game chat translator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "kazoogh" }]
dependencies = [
  "platformdirs==4.3.8",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pre-commit==4.3.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]
windows = [
  "psutil==7.0.0; sys_platform == 'win32'",
  "pywin32==311; sys_platform == 'win32'",
]
capture = [
  "dxcam==0.0.5; sys_platform == 'win32'",
  "mss==10.0.0",
  "numpy==2.2.6",
]
ui = [
  "PySide6==6.9.1",
]
language = [
  "fasttext-wheel==0.9.2; python_version == '3.12'",
]
translation = [
  "argostranslate==1.11.0",
  "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.19/llama_cpp_python-0.3.19-cp312-cp312-win_amd64.whl#sha256=1843b30d90e35296dbd9bd0b2b753b42f0fafa6aec6d2b1c0fff352f801bc89b ; sys_platform == 'win32' and python_version == '3.12'",
]
vision = [
  "numpy==2.2.6",
  "opencv-contrib-python==4.10.0.84",
  "paddleocr==3.2.0",
  "paddlepaddle==3.1.1",
]
build = [
  "pyinstaller==6.15.0",
]

[project.scripts]
game-chat-translator = "game_chat_translator.__main__:main"
gct-validate = "game_chat_translator.validation.cli:main"
gct-diagnostics = "game_chat_translator.diagnostics:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# DXcam 0.0.5 declares OpenCV although its capture package does not import it. The vision runtime
# supplies the compatible contrib build, avoiding two distributions that both own `cv2` on Windows.
override-dependencies = [
  "opencv-python==4.10.0.84; sys_platform != 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/game_chat_translator"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "game_chat_translator/resources/assets"
"data" = "game_chat_translator/resources/data"
"profiles" = "game_chat_translator/resources/profiles"
"THIRD_PARTY_NOTICES.md" = "game_chat_translator/resources/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "language: requires the pinned local fastText language extra",
  "speech_native: requires Windows SAPI and the pinned pywin32 extra",
  "translation_native: requires pinned Argos and llama.cpp translation extras",
  "vision: requires the pinned OCR/vision extra",
  "windows_ui: optional native Windows/Qt calibration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["game_chat_translator"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "cv2",
  "dxcam",
  "mss",
  "numpy",
  "paddleocr",
  "fasttext",
  "argostranslate.*",
  "llama_cpp",
  "PySide6.*",
  "win32api",
  "win32gui",
  "win32process",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["game_chat_translator.ui.region_selector"]
warn_unused_ignores = false
